name: rider_app
description: FairGo Rider — Book rides, parcels and hired drivers
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.4.1
  hooks_riverpod: ^2.6.1
  flutter_hooks: ^0.21.0

  # Navigation
  go_router: ^14.6.3

  # Network
  dio: ^5.7.0
  retrofit: ^4.4.1
  web_socket_channel: ^3.0.0

  # Local storage
  drift: ^2.22.1
  drift_flutter: ^0.2.2
  sqlite3_flutter_libs: ^0.5.24
  shared_preferences: ^2.3.5
  flutter_secure_storage: ^9.2.4

  # Maps
  google_maps_flutter: ^2.10.0
  geolocator: ^13.0.4
  geocoding: ^3.0.0
  flutter_polyline_points: ^2.1.0

  # UI components
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  lottie: ^3.1.3
  shimmer: ^3.0.0
  flutter_rating_bar: ^4.0.1
  pin_code_fields: ^8.0.1
  intl_phone_number_input: ^0.7.4
  modal_bottom_sheet: ^3.0.0
  sliding_up_panel: ^2.0.0+1
  timelines_plus: ^1.0.0
  dotted_border: ^2.1.0
  flutter_staggered_animations: ^1.1.1
  percent_indicator: ^4.2.4

  # Connectivity & Platform
  connectivity_plus: ^6.1.1
  internet_connection_checker_plus: ^2.5.1
  device_info_plus: ^11.1.4
  package_info_plus: ^8.1.3
  permission_handler: ^11.3.1

  # Notifications
  firebase_core: ^3.9.0
  firebase_messaging: ^15.2.0
  flutter_local_notifications: ^18.0.1

  # Payments
  razorpay_flutter: ^1.3.7

  # Auth & Security
  local_auth: ^2.3.0
  flutter_keychain: ^2.4.1

  # Analytics / Crash
  firebase_analytics: ^11.4.0
  firebase_crashlytics: ^4.2.0

  # Utils
  intl: ^0.20.0
  logger: ^2.5.0
  equatable: ^2.0.7
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  uuid: ^4.5.1
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  flutter_map: ^7.0.2
  timeago: ^3.7.0
  smooth_page_indicator: ^1.2.0+3
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.14
  riverpod_generator: ^2.4.4
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  retrofit_generator: ^9.1.7
  drift_dev: ^2.22.1
  mocktail: ^1.0.4
  mockito: ^5.4.5

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/fonts/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
